# Gritty Terminal Configuration

[main]
shell = ""
term = "xterm-256color"
title = "Gritty"

[font]
family = "Monaco"
size = 13.0
dpi = 96
antialias = grayscale

[cursor]
style = block
blink = false
color = "#ffffff"

[colors]
foreground = #dddddd
background = #111111
alpha = 0.8
# alpha multiplies any alpha in background. Text and explicit app backgrounds stay opaque.
# For Neovim transparency, set Normal/NormalNC/NormalFloat bg to NONE in your theme.
cursor = "#ffffff"

# ANSI 16 colors
regular0 = "#000000"
regular1 = "#cc0403"
regular2 = "#19cb00"
regular3 = "#cecb00"
regular4 = "#0d73cc"
regular5 = "#cb1ed1"
regular6 = "#0dcdcd"
regular7 = "#dddddd"

bright0 = "#767676"
bright1 = "#f2201f"
bright2 = "#23fd00"
bright3 = "#fffd00"
bright4 = "#1a8fff"
bright5 = "#fd28ff"
bright6 = "#14ffff"
bright7 = "#ffffff"

[scrollback]
lines = 2000
multiplier = 3

# macOS platform overrides
[macos.font]
family = JetBrainsMono Nerd Font
size = 14.0

# Linux platform overrides
[linux.font]
family = monospace
size = 11.0
