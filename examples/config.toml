# Gritty Terminal Configuration

[main]
shell = ""
term = "xterm-256color"
title = "Gritty"
# foot-compatible clipboard security policy:
# disabled | copy-only (default) | paste-only | enabled
osc52 = "copy-only"

[font]
family = "Menlo"
size = 11.25
dpi = 72 # 72 on macOS to match CoreText / Alacritty point scale; 96 on Linux
antialias = "grayscale" # grayscale | subpixel | none

[cursor]
style = "block"   # block | beam | underline
blink = false
color = "#ffffff"

[colors]
foreground = "#dddddd"
background = "#111111" # Also accepts #AARRGGBB, e.g. #cc111111 (80% opaque)
alpha = 1.0            # 0.0 = clear, 1.0 = opaque; only used when decorations are not "full"
# alpha multiplies any alpha in background. Text and explicit app backgrounds stay opaque.
# Full decorations are always opaque; use decorations = "transparent" (or "buttonless") with
# alpha < 1 for a translucent background. For Neovim transparency, set
# Normal/NormalNC/NormalFloat bg to NONE in your theme.
cursor = "#ffffff"

# ANSI 16 colors
regular0 = "#000000"
regular1 = "#cc0403"
regular2 = "#19cb00"
regular3 = "#cecb00"
regular4 = "#0d73cc"
regular5 = "#cb1ed1"
regular6 = "#0dcdcd"
regular7 = "#dddddd"

bright0 = "#767676"
bright1 = "#f2201f"
bright2 = "#23fd00"
bright3 = "#fffd00"
bright4 = "#1a8fff"
bright5 = "#fd28ff"
bright6 = "#14ffff"
bright7 = "#ffffff"

[window]
# full | none | transparent | buttonless
decorations = "full"
# Space around the terminal grid, in logical points (0..512 each side).
# padding = 8            # shorthand for both axes
# padding = { x = 8, y = 4 }

# macOS Platform Overrides (automatically deep-merged on macOS)
[platform.macos]
font = { family = "JetBrainsMono Nerd Font", size = 14.0 }

# Linux Platform Overrides (automatically deep-merged on Linux)
[platform.linux]
font = { family = "monospace", size = 11.25, dpi = 96 }
