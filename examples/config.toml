# Gritty Terminal Configuration (Alacritty-compatible TOML schema)

[general]
working_directory = "None" # "None" follows inherited cwd (or $HOME if launched in "/")

[env]
TERM = "xterm-256color"

[window]
title = "Gritty"
class = { general = "gritty" }
# Full | None | Transparent | Buttonless
decorations = "Full"
# 0.0 = clear, 1.0 = opaque (only applied when decorations != "Full")
opacity = 1.0
# padding = 8
padding = { x = 0, y = 0 }
dimensions = { columns = 80, lines = 24 }

[font]
normal = { family = "Menlo" }
size = 11.25
dpi = 72              # 72 on macOS to match CoreText / Alacritty; 96 on Linux
antialias = "grayscale" # grayscale | subpixel | none

[cursor]
# shape: Block | Underline | Beam, blinking: Never | Off | On | Always
style = { shape = "Block", blinking = "Off" }

[colors.primary]
foreground = "#dddddd"
background = "#111111"

[colors.cursor]
cursor = "#ffffff"

# ANSI 16 colors (SGR 2 dim is computed from the active foreground color)
[colors.normal]
black = "#282c34"
red = "#f67e7d"
green = "#cae7b9"
yellow = "#e1dd8f"
blue = "#7cb7ff"
magenta = "#d7bcc8"
cyan = "#00c1e4"
white = "#dcdfe4"

[colors.bright]
black = "#282c34"
red = "#f67e7d"
green = "#cae7b9"
yellow = "#e1dd8f"
blue = "#7cb7ff"
magenta = "#d7bcc8"
cyan = "#00c1e4"
white = "#dcdfe4"

[terminal]
# Disabled | OnlyCopy | OnlyPaste | CopyPaste
osc52 = "OnlyCopy"

# Empty uses your system shell ($SHELL -> user account shell -> /bin/zsh on macOS,
# /bin/bash on Linux), started as a login shell on macOS.
# [terminal.shell]
# program = "/bin/zsh"
# args = ["-l"]

# Platform overrides (deep-merged automatically on the active OS)
[platform.macos]
font = { normal = { family = "JetBrainsMono Nerd Font" }, size = 14.0 }

[platform.linux]
font = { normal = { family = "monospace" }, size = 11.25, dpi = 96 }
