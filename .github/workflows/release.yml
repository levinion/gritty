name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    outputs:
      version: ${{ steps.package.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
      asset_path: ${{ steps.package.outputs.asset_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install meson ninja pkg-config pixman freetype harfbuzz utf8proc libpng doctest tmux

      - name: Configure release build
        run: |
          meson setup build/release \
            --buildtype=release \
            -Db_lto=true \
            -Dtests=true

      - name: Compile
        run: meson compile -C build/release

      - name: Test
        run: meson test -C build/release --print-errorlogs

      - name: Package
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash packaging/macos/package.sh "$VERSION"
          ARCHIVE="dist/gritty-${VERSION}-macos-arm64.tar.gz"
          SHA256="$(shasum -a 256 "$ARCHIVE" | awk '{print $1}')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "asset_path=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: gritty-macos-arm64
          path: dist/*.tar.gz

  publish-release:
    needs: [build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: gritty-macos-arm64
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: gritty ${{ needs.build-macos.outputs.version }}
          files: ${{ needs.build-macos.outputs.asset_path }}
          generate_release_notes: true

  sync-cask:
    needs: [build-macos, publish-release]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build-macos.outputs.version }}
      CASK_SHA: ${{ needs.build-macos.outputs.sha256 }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update Homebrew Cask
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          cask_sha = os.environ["CASK_SHA"]
          cask = pathlib.Path("Casks/gritty.rb")
          text = cask.read_text()
          text = re.sub(r'version "[^"]+"', f'version "{version}"', text, count=1)
          text = re.sub(r'sha256 "[0-9a-f]{64}"', f'sha256 "{cask_sha}"', text, count=1)
          cask.write_text(text)
          PY

      - name: Commit and push Cask update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/gritty.rb
          if git diff --cached --quiet; then
            echo "Cask metadata is already current"
          else
            git commit -m "chore: sync cask for v${VERSION} [skip ci]"
            git push origin main
          fi
