name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15
    outputs:
      version: ${{ steps.package.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
      asset_path: ${{ steps.package.outputs.asset_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install meson ninja pkg-config pixman freetype harfbuzz utf8proc libpng doctest

      - name: Configure release build
        run: |
          meson setup build/release \
            --buildtype=release \
            -Db_lto=true \
            -Dtests=true \
            -Dbenchmarks=false \
            -Dgui_tests=false

      - name: Compile
        run: meson compile -C build/release

      - name: Test
        run: meson test -C build/release --print-errorlogs

      - name: Package
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash packaging/macos/package.sh "$VERSION"
          ARCHIVE="dist/gritty-${VERSION}-macos-arm64.tar.gz"
          SHA256="$(shasum -a 256 "$ARCHIVE" | awk '{print $1}')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "asset_path=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: gritty-macos-arm64
          path: dist/*.tar.gz

  verify-archlinux:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman-key --init
          pacman -Syu --noconfirm --needed \
            base-devel clang git meson ninja pkgconf pixman freetype2 harfbuzz \
            utf8proc libpng zlib wayland wayland-protocols libxkbcommon \
            fontconfig doctest

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure release build
        run: |
          meson setup build/release \
            --buildtype=release \
            -Db_lto=true \
            -Dtests=true \
            -Dbenchmarks=false \
            -Dgui_tests=false

      - name: Compile
        run: meson compile -C build/release

      - name: Test
        run: meson test -C build/release --print-errorlogs

  publish-release:
    needs: [build-macos, verify-archlinux]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: gritty-macos-arm64
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: gritty ${{ needs.build-macos.outputs.version }}
          files: ${{ needs.build-macos.outputs.asset_path }}
          generate_release_notes: true

  sync-cask-and-aur:
    needs: [build-macos, publish-release]
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      VERSION: ${{ needs.build-macos.outputs.version }}
      CASK_SHA: ${{ needs.build-macos.outputs.sha256 }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - name: Install dependencies
        run: |
          pacman-key --init
          pacman -Syu --noconfirm --needed base-devel git python openssh

      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Cask and AUR package
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import pathlib
          import re
          import urllib.request

          version = os.environ["VERSION"]
          cask_sha = os.environ["CASK_SHA"]
          root = pathlib.Path.cwd()

          cask = root / "Casks" / "gritty.rb"
          text = cask.read_text()
          text = re.sub(r'version "[^"]+"', f'version "{version}"', text, count=1)
          text = re.sub(r'sha256 "[0-9a-f]{64}"', f'sha256 "{cask_sha}"', text, count=1)
          cask.write_text(text)

          source_url = (
              f"https://github.com/levinion/gritty/archive/refs/tags/v{version}.tar.gz"
          )
          with urllib.request.urlopen(source_url) as response:
              source = response.read()
          aur_sha = hashlib.sha256(source).hexdigest()

          pkgbuild = root / "packaging" / "aur" / "gritty" / "PKGBUILD"
          text = pkgbuild.read_text()
          text = re.sub(r"^pkgver=.*$", f"pkgver={version}", text, count=1, flags=re.M)
          text = re.sub(r"^pkgrel=.*$", "pkgrel=1", text, count=1, flags=re.M)
          text = re.sub(r"^sha256sums=.*$", f"sha256sums=('{aur_sha}')", text, count=1, flags=re.M)
          pkgbuild.write_text(text)
          PY

      - name: Regenerate AUR SRCINFO
        run: |
          useradd -m -u 1001 builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/aur/gritty' && makepkg --printsrcinfo > .SRCINFO"

      - name: Commit metadata updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/gritty.rb packaging/aur/gritty/PKGBUILD packaging/aur/gritty/.SRCINFO
          if git diff --cached --quiet; then
            echo "No metadata changes"
          else
            git commit -m "chore: sync release ${VERSION} metadata [skip ci]"
            git push origin HEAD:main
          fi

      - name: Push to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "AUR_SSH_PRIVATE_KEY is not configured; skipping AUR push"
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          cat > ~/.ssh/config <<'SSH'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
          SSH
          chmod 600 ~/.ssh/config
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          git clone ssh://aur@aur.archlinux.org/gritty.git /tmp/gritty-aur
          cp packaging/aur/gritty/PKGBUILD /tmp/gritty-aur/
          cp packaging/aur/gritty/.SRCINFO /tmp/gritty-aur/
          cd /tmp/gritty-aur
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR package is already current"
          else
            git commit -m "Update gritty to ${VERSION}"
            git push origin master
          fi
