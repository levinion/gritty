# Measurement fixture, not the user's configuration. Keep baseline and candidate
# effective font/geometry/DPI identical. Disable transparency for pixel detection.
[font]
family = "monospace"
size = 13.0
dpi = 96
antialias = "grayscale"

[colors]
foreground = "#ffffff"
background = "#000000"
alpha = 1.0

[cursor]
blink = false

[platform.macos.font]
family = "Monaco"
